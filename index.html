<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JLPT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#33357a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<title>JLPT 모의시험 N5–N3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-serif:'Noto Serif JP',Georgia,serif;
  --font-ui:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Hiragino Sans','Segoe UI',Roboto,sans-serif;
  --bg:#fbfaf6; --surface:#ffffff; --surface-2:#f3f1ec;
  --ink:#1e2233; --muted:#6b6f7d; --line:#e6e2d8;
  --brand:#33357a; --brand-soft:#ecebf5; --on-brand:#ffffff;
  --ok:#1f7a4d; --ok-bg:#e7f4ec; --no:#c0392b; --no-bg:#fbe9e7;
  --save:#b7791f; --save-bg:#fbf1dc;
  --shadow:0 1px 2px rgba(30,34,51,.06),0 8px 24px rgba(30,34,51,.06);
  --radius:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14151a; --surface:#1c1e26; --surface-2:#232630;
  --ink:#e9e8f0; --muted:#9aa0b0; --line:#2c2f3a;
  --brand:#a6a9f2; --brand-soft:#262a45; --on-brand:#14151a;
  --ok:#66d19e; --ok-bg:#173026; --no:#ff8578; --no-bg:#3a2320;
  --save:#e0a94a; --save-bg:#2e2717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.serif{font-family:var(--font-serif)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.topbar .back{font-size:15px;font-weight:600;color:var(--brand);padding:6px 8px;margin-left:-8px}
.topbar .ttl{font-weight:700;font-size:16px;flex:1;text-align:center}
.topbar .rt{min-width:52px;text-align:right;font-size:13px;color:var(--muted);font-weight:600}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(env(safe-area-inset-bottom) + 40px)}
.prog{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:2px 0 14px}
.prog>i{display:block;height:100%;background:var(--brand);transition:width .25s}

.hero{padding:14px 4px 6px}
.hero h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.hero p{color:var(--muted);margin:0;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.lvl{display:flex;align-items:center;gap:14px;cursor:pointer}
.lvl .badge{font-family:var(--font-serif);font-weight:700;font-size:22px;color:var(--on-brand);background:var(--brand);width:56px;height:56px;border-radius:14px;display:grid;place-items:center;flex:none}
.lvl .meta{flex:1}
.lvl .meta b{font-size:16px}
.lvl .meta span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.lvl .chev{color:var(--muted);font-size:20px}
.dim{opacity:.5}

.subhead{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:20px 4px 6px}
.resume{display:flex;align-items:center;gap:12px}
.resume .badge2{font-family:var(--font-serif);font-weight:700;color:var(--save);background:var(--save-bg);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.resume .meta{flex:1;min-width:0}
.resume .meta b{font-size:15px}
.resume .meta span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.rbtn{flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);width:38px;height:38px;border-radius:11px;font-size:16px}
.entry{display:flex;align-items:center;gap:12px;cursor:pointer}
.entry .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:20px;background:var(--brand-soft)}
.entry .t{flex:1}.entry .t b{font-size:15px}.entry .t span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.entry .chev{color:var(--muted);font-size:20px}

.secrow{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.secrow:last-child{border-bottom:none}
.secrow .ic{font-family:var(--font-serif);font-weight:700;color:var(--brand);background:var(--brand-soft);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px}
.secrow .t{flex:1}
.secrow .t b{font-size:15px}
.secrow .t span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.secrow .n{color:var(--muted);font-size:13px;font-weight:600}

.qmeta{display:flex;align-items:center;gap:8px;margin:2px 0 10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:4px 10px;border-radius:999px}
.tag.blk{color:var(--muted);background:var(--surface-2)}
.instr{color:var(--muted);font-size:13.5px;margin:0 0 12px;line-height:1.5}
.passage{background:var(--surface-2);border-radius:12px;padding:14px 16px;margin:0 0 14px;font-family:var(--font-serif);font-size:16px;line-height:2;white-space:pre-wrap}
.stem{font-family:var(--font-serif);font-size:21px;line-height:2;margin:0 0 18px}
.stem u{text-decoration:none;border-bottom:2px solid var(--brand);padding-bottom:1px}
.blank{border-bottom:2px solid var(--muted);padding:0 22px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;font-family:var(--font-serif);font-size:17px;transition:.12s}
.choice .num{font-family:var(--font-ui);font-weight:700;font-size:13px;color:var(--muted);width:22px;height:22px;border:1.5px solid var(--line);border-radius:50%;display:grid;place-items:center;flex:none}
.choice:active{transform:scale(.99)}
.choice.pick{border-color:var(--brand)}
.choice.correct{border-color:var(--ok);background:var(--ok-bg)}
.choice.correct .num{border-color:var(--ok);color:var(--ok)}
.choice.wrong{border-color:var(--no);background:var(--no-bg)}
.choice.wrong .num{border-color:var(--no);color:var(--no)}
.choice[disabled]{cursor:default}
.mark{margin-left:auto;font-weight:800;font-size:16px}
.mark.ok{color:var(--ok)} .mark.no{color:var(--no)}

.exp{margin-top:16px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.exp .verdict{padding:12px 16px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.exp .verdict.ok{background:var(--ok-bg);color:var(--ok)}
.exp .verdict.no{background:var(--no-bg);color:var(--no)}
.exp .body{padding:14px 16px}
.exp .row{margin:0 0 12px}
.exp .row:last-child{margin:0}
.exp .k{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin:0 0 3px}
.exp .v{font-size:15px;line-height:1.65}
.exp .v em{font-style:normal;font-weight:700;color:var(--brand)}

.foot{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:10px}
.btn{flex:1;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:16px;padding:15px;border-radius:14px;box-shadow:var(--shadow)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn[disabled]{opacity:.4}

.score{text-align:center;padding:22px 0 8px}
.score .big{font-size:52px;font-weight:800;color:var(--brand);font-family:var(--font-serif)}
.score .sub{color:var(--muted)}
.rev{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px}
.rev:last-child{border-bottom:none}
.rev .rn{width:24px;color:var(--muted);font-weight:700}
.rev .rt{flex:1;font-family:var(--font-serif)}
.rev .rm{font-weight:800}

.listrow{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.listrow:last-child{border-bottom:none}
.listrow .d{flex:1;min-width:0}
.listrow .d b{font-size:14px}
.listrow .d span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.listrow .sc{font-weight:800;color:var(--brand);font-family:var(--font-serif);font-size:15px}
.listrow .wq{flex:1;font-family:var(--font-serif);font-size:14px;min-width:0}
.listrow .wt{color:var(--muted);font-size:12px;flex:none}
.clear{color:var(--no);font-size:13px;font-weight:600;text-align:center;padding:14px;width:100%}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px;line-height:1.7}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="back" id="back" style="visibility:hidden">‹ 뒤로</button>
    <div class="ttl" id="ttl">JLPT</div>
    <div class="rt" id="rt"></div>
  </div>
  <div class="view" id="view"></div>
</div>

<script>
/* =========================================================================
   JLPT 모의시험 프레임워크 (청해 제외)
   기능: 자동저장·이어풀기 / 지난 결과 기록 / 오답 노트 재풀이
   저장: localStorage (로그인·서버 불필요, 이 기기·브라우저 안에 보관)
   -------------------------------------------------------------------------
   BANK 스키마 — 문제 추가는 이 형식만 지키면 됩니다.
   {
     block:"もんだい1",  type:"漢字読み",  typeKo:"한자 읽기",
     instr:"지시문(선택)",  passage:"독해 지문(선택)",
     stem:"あしたは {雨}ですか。",   // {…}=밑줄, ___ 또는 （ ）=빈칸
     choices:["ゆき","はれ","くもり","あめ"],  answer:3,   // 0부터
     ko:"내일은 비입니까?",         // 문장 해석
     exp:"해설 … <em>강조</em>"     // 문법·조사·한자 해설
   }
   ========================================================================= */

const SECTIONS={
  vocab:{ko:"문자 · 어휘",jp:"文字・語彙",ic:"字"},
  grammar:{ko:"문법",jp:"文法",ic:"文"},
  reading:{ko:"독해",jp:"読解",ic:"読"},
};

const BANK={
  N5:{
    vocab:[
      {block:"もんだい1",type:"漢字読み",typeKo:"한자 읽기",
       instr:"___의 말은 히라가나로 어떻게 씁니까?",
       stem:"あしたは {雨}ですか。",choices:["ゆき","はれ","くもり","あめ"],answer:3,
       ko:"내일은 비입니까?",
       exp:"「雨」의 훈독은 <em>あめ</em>(비), 음독은 「う」(雨天 うてん 등). 단독 명사이므로 훈독 <em>あめ</em>. 오답: ゆき=雪(눈)·はれ=晴れ(맑음)·くもり=曇り(흐림)."},
      {block:"もんだい1",type:"漢字読み",typeKo:"한자 읽기",
       instr:"___의 말은 히라가나로 어떻게 씁니까?",
       stem:"きょうしつで {書いて} ください。",choices:["かいて","きいて","はいて","ひいて"],answer:0,
       ko:"교실에서 써 주세요.",
       exp:"「書く」(쓰다)의 て형은 <em>かいて</em>. 「~て ください」는 '~해 주세요'의 요청. 혼동: きいて=聞いて(듣다)·はいて=履いて(신다)."},
      {block:"もんだい1",type:"漢字読み",typeKo:"한자 읽기",
       instr:"___의 말은 히라가나로 어떻게 씁니까?",
       stem:"しゃしんは はこの {中}に あります。",choices:["そば","そと","なか","よこ"],answer:2,
       ko:"사진은 상자 안에 있습니다.",
       exp:"「中」=<em>なか</em>(안·속). 「~の 中に」='~의 안에'. 위치명사: そば(곁)·そと=外(밖)·よこ=横(옆)."},
      {block:"もんだい1",type:"漢字読み",typeKo:"한자 읽기",
       instr:"___의 말은 히라가나로 어떻게 씁니까?",
       stem:"あしたは {火}よう日です。",choices:["どようび","すいようび","かようび","にちようび"],answer:2,
       ko:"내일은 화요일입니다.",
       exp:"요일 한자: 火=<em>か</em>(화), 水=すい, 土=ど, 日=にち. 「火よう日」=かようび."},
    ],
    grammar:[
      {block:"もんだい1",type:"文法形式（助詞）",typeKo:"문법형식·조사",
       instr:"( )에 무엇을 넣습니까?",
       stem:"わたしは あしたの ひこうき（ ）くにへ かえります。",choices:["に","で","か","を"],answer:1,
       ko:"나는 내일 비행기로 고국에 돌아갑니다.",
       exp:"수단·도구의 조사 <em>で</em>. '비행기로(수단)'. 「~へ かえる」='~로 돌아가다'. 「に」는 도착점·시간, 「を」는 목적어라 부적합."},
      {block:"もんだい1",type:"文法形式（助詞）",typeKo:"문법형식·조사",
       instr:"( )에 무엇을 넣습니까?",
       stem:"きのう スーパーで たなかさん（ ）あいました。",choices:["を","の","で","に"],answer:3,
       ko:"어제 슈퍼에서 다나카 씨를 만났습니다.",
       exp:"「会う」(만나다)는 대상에 조사 <em>に</em>를 취합니다: 「人に 会う」. 한국어 '~를 만나다' 때문에 「を」로 착각하기 쉬우니 주의. 「で」는 장소(スーパーで)."},
      {block:"もんだい1",type:"文法形式（助詞）",typeKo:"문법형식·조사",
       instr:"( )에 무엇을 넣습니까?",
       stem:"せんしゅう デパートで かばん（ ）くつなどを かいました。",choices:["は","も","へ","や"],answer:3,
       ko:"지난주 백화점에서 가방이랑 신발 등을 샀습니다.",
       exp:"열거의 조사 <em>や</em>. 「AやB」='A랑 B(그 외에도)'. 뒤의 「〜など」(등)와 호응. 전부 나열하는 「と」와 달리 대표 예만 드는 뉘앙스."},
    ],
    reading:[
      {block:"もんだい4",type:"内容理解（短文）",typeKo:"내용이해·단문",
       instr:"다음 글을 읽고 질문에 답하세요.",
       passage:"わたしは まいあさ 6じに おきます。そして、こうえんを さんぽします。あさごはんの あとで、しんぶんを よみます。",
       stem:"この ひとは あさごはんの あとで なにを しますか。",
       choices:["さんぽします","しんぶんを よみます","6じに おきます","がっこうへ いきます"],answer:1,
       ko:"지문: 나는 매일 아침 6시에 일어납니다. 그리고 공원을 산책합니다. 아침 식사 후에 신문을 읽습니다. / 문제: 이 사람은 아침 식사 후에 무엇을 합니까?",
       exp:"「あさごはんの あとで」='아침 식사 후에'. 마지막 문장 「しんぶんを よみます」와 대응. <em>あとで</em>(후에) ↔ <em>まえに</em>(전에)를 구분하는 문제."},
    ],
  },
  N4:{vocab:[],grammar:[],reading:[]},
  N3:{vocab:[],grammar:[],reading:[]},
};

/* ---------------- 저장소 ---------------- */
const LS={
  get(k,d){try{const v=localStorage.getItem("jlpt."+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("jlpt."+k,JSON.stringify(v));}catch(e){}},
};
const sig=(lvl,q)=>lvl+"|"+q.block+"|"+q.stem;
function saveProgress(s){const p=LS.get("progress",{});p[s.key]={...s,ts:Date.now()};LS.set("progress",p);}
function clearProgress(key){const p=LS.get("progress",{});delete p[key];LS.set("progress",p);}
function progAnswered(s){return s.answers.filter(a=>a!==null).length;}

/* ---------------- 공통 UI ---------------- */
const view=document.getElementById("view"),ttl=document.getElementById("ttl"),
      rt=document.getElementById("rt"),back=document.getElementById("back");
const NUM=["①","②","③","④","⑤"];
let stack=[];
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function go(fn){stack.push(fn);fn();}
function reset(){stack=[];go(home);}
back.onclick=()=>{if(stack.length>1){stack.pop();stack[stack.length-1]();}};
function setTop(t,r){ttl.textContent=t;rt.textContent=r||"";back.style.visibility=stack.length>1?"visible":"hidden";view.scrollTop=0;}
function cleanStem(s){return s.replace(/[{}]/g,"").replace(/___|（ ）|\( \)/g,"（　）");}

/* ---------------- 홈 ---------------- */
function home(){
  setTop("JLPT 모의시험");
  const prog=LS.get("progress",{});
  const resumes=Object.values(prog).filter(s=>progAnswered(s)<s.qs.length).sort((a,b)=>b.ts-a.ts);
  const results=LS.get("results",[]);
  const wrong=LS.get("wrong",[]);
  const counts=l=>Object.keys(SECTIONS).reduce((a,s)=>a+(BANK[l][s]?.length||0),0);

  let html=`<div class="hero"><h1 class="serif">JLPT 모의시험</h1><p>N5 · N4 · N3　(청해 제외)</p></div>`;

  if(resumes.length){
    html+=`<div class="subhead">이어서 풀기</div>`;
    html+=resumes.map(s=>`
      <div class="card resume" data-key="${s.key}">
        <div class="badge2 serif">${s.level==="오답"?"復":s.level}</div>
        <div class="meta rz" data-key="${s.key}">
          <b>${esc(s.level==="오답"?"오답 노트":s.level+" "+s.label)}</b>
          <span>${progAnswered(s)} / ${s.qs.length} 문항까지 진행</span></div>
        <button class="rbtn" data-restart="${s.key}" title="처음부터">↺</button>
      </div>`).join("");
  }

  html+=`<div class="subhead">모의시험</div>`;
  html+=["N5","N4","N3"].map(l=>{const c=counts(l);return `
    <div class="card lvl ${c?"":"dim"}" data-l="${l}">
      <div class="badge serif">${l}</div>
      <div class="meta"><b>${l} 모의시험</b><span>${c?c+"문항 준비됨":"문제 준비 중"}</span></div>
      <div class="chev">›</div>
    </div>`;}).join("");

  html+=`<div class="subhead">기록</div>
    <div class="card entry" id="goResults">
      <div class="ic">🗂️</div>
      <div class="t"><b>지난 결과</b><span>${results.length?results.length+"회 응시 기록":"아직 기록 없음"}</span></div>
      <div class="chev">›</div></div>
    <div class="card entry" id="goWrong">
      <div class="ic">🔁</div>
      <div class="t"><b>오답 노트</b><span>${wrong.length?wrong.length+"문항 모임 · 다시 풀기":"오답 없음"}</span></div>
      <div class="chev">›</div></div>
    <div class="empty">답을 고를 때마다 자동 저장됩니다.<br>홈 화면에 추가(PWA)하면 기록이 더 오래 보관됩니다.</div>`;

  view.innerHTML=html;
  view.querySelectorAll(".rz").forEach(el=>el.onclick=()=>{const s=LS.get("progress",{})[el.dataset.key];if(s)go(()=>run(s));});
  view.querySelectorAll("[data-restart]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();const key=b.dataset.restart;const s=LS.get("progress",{})[key];
    clearProgress(key);
    if(!s)return home();
    if(s.mode==="wrong")go(beginWrong); else go(()=>beginExam(s.level,s.keys));
  });
  view.querySelectorAll(".lvl").forEach(el=>{const l=el.dataset.l;if(counts(l))el.onclick=()=>go(()=>sectionList(l));});
  document.getElementById("goResults").onclick=()=>go(resultsView);
  document.getElementById("goWrong").onclick=()=>go(wrongView);
}

/* ---------------- 영역 선택 ---------------- */
function sectionList(level){
  setTop(level+" 영역 선택");
  const rows=Object.entries(SECTIONS).map(([k,s])=>{
    const n=BANK[level][k]?.length||0;
    return `<div class="secrow ${n?"":"dim"}" data-s="${k}">
      <div class="ic serif">${s.ic}</div>
      <div class="t"><b>${s.ko}</b><span class="serif">${s.jp}</span></div>
      <div class="n">${n?n+"문항":"준비 중"} ›</div></div>`;
  }).join("");
  const total=Object.keys(SECTIONS).reduce((a,k)=>a+(BANK[level][k]?.length||0),0);
  view.innerHTML=`<div class="card" style="padding:6px 16px">${rows}</div>
    <button class="btn" id="all" style="margin-top:4px">전체 응시 (${total}문항)</button>`;
  view.querySelectorAll(".secrow").forEach(el=>{const k=el.dataset.s;if(BANK[level][k]?.length)el.onclick=()=>go(()=>beginExam(level,[k]));});
  document.getElementById("all").onclick=()=>total&&go(()=>beginExam(level,Object.keys(SECTIONS)));
}

/* ---------------- 세션 생성 ---------------- */
function keyOf(level,keys){return keys.length>1?level+":ALL":level+":"+keys[0];}
function beginExam(level,keys){
  const key=keyOf(level,keys);
  const saved=LS.get("progress",{})[key];
  if(saved&&progAnswered(saved)<saved.qs.length)return run(saved);
  const qs=keys.flatMap(k=>(BANK[level][k]||[]).map(q=>({...q,sec:k,level,_sig:sig(level,q)})));
  run({level,label:keys.length>1?"전체":SECTIONS[keys[0]].ko,mode:"exam",keys,key,qs,i:0,answers:Array(qs.length).fill(null)});
}
function beginWrong(){
  const wrong=LS.get("wrong",[]);
  if(!wrong.length){reset();return;}
  const key="wrong",saved=LS.get("progress",{})[key];
  if(saved&&progAnswered(saved)<saved.qs.length)return run(saved);
  const qs=wrong.map(w=>({...w.q}));
  run({level:"오답",label:"오답 노트",mode:"wrong",keys:[],key,qs,i:0,answers:Array(qs.length).fill(null)});
}

/* ---------------- 시험 진행 ---------------- */
function run(session){
  const qs=session.qs;
  function render(){
    const q=qs[session.i],picked=session.answers[session.i],done=picked!==null;
    setTop(`${session.level} · ${session.label}`,`${session.i+1}/${qs.length}`);
    const stemHtml=esc(q.stem).replace(/\{([^}]*)\}/g,'<u>$1</u>').replace(/___|（ ）|\( \)/g,'<span class="blank"> </span>');
    const choices=q.choices.map((c,idx)=>{
      let cls="choice";
      if(done){if(idx===q.answer)cls+=" correct";else if(idx===picked)cls+=" wrong";}
      else if(idx===picked)cls+=" pick";
      const mark=done?(idx===q.answer?'<span class="mark ok">○</span>':(idx===picked?'<span class="mark no">✕</span>':"")):"";
      return `<button class="${cls}" data-i="${idx}" ${done?"disabled":""}><span class="num">${idx+1}</span><span>${esc(c)}</span>${mark}</button>`;
    }).join("");
    view.innerHTML=`
      <div class="prog"><i style="width:${session.i/qs.length*100}%"></i></div>
      <div class="qmeta"><span class="tag blk serif">${esc(q.block)}</span><span class="tag">${esc(q.typeKo)}</span></div>
      ${q.instr?`<p class="instr">${esc(q.instr)}</p>`:""}
      ${q.passage?`<div class="passage">${esc(q.passage)}</div>`:""}
      <p class="stem">${stemHtml}</p>
      <div class="choices">${choices}</div>
      <div id="explain"></div>`;
    view.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{session.answers[session.i]=+b.dataset.i;saveProgress(session);render();});
    if(done)showExplain(q,picked);
  }
  function showExplain(q,picked){
    const ok=picked===q.answer;
    document.getElementById("explain").innerHTML=`<div class="exp">
      <div class="verdict ${ok?"ok":"no"}">${ok?"○ 정답입니다":"✕ 오답입니다"} · 정답 ${NUM[q.answer]} ${esc(q.choices[q.answer])}</div>
      <div class="body">
        <div class="row"><p class="k">무엇을 묻는가</p><p class="v"><span class="serif">${esc(q.type)}</span> — ${esc(q.typeKo)}</p></div>
        <div class="row"><p class="k">문장 해석</p><p class="v">${esc(q.ko)}</p></div>
        <div class="row"><p class="k">해설 (문법·조사·한자)</p><p class="v">${q.exp||""}</p></div>
      </div></div>
      <div class="foot"><button class="btn" id="next">${session.i<qs.length-1?"다음 문제 ›":"결과 보기 →"}</button></div>`;
    document.getElementById("next").onclick=()=>{
      if(session.i<qs.length-1){session.i++;saveProgress(session);render();}
      else finish(session);
    };
    document.getElementById("explain").scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  render();
}

/* ---------------- 종료·채점·기록 ---------------- */
function finish(session){
  const qs=session.qs,ans=session.answers;
  clearProgress(session.key);
  const correct=ans.filter((a,i)=>a===qs[i].answer).length;
  // 결과 기록
  const results=LS.get("results",[]);
  results.unshift({level:session.level,label:session.label,mode:session.mode,
    correct,total:qs.length,pct:Math.round(correct/qs.length*100),date:Date.now(),
    qs:qs.map(q=>({stem:q.stem,typeKo:q.typeKo,choices:q.choices,answer:q.answer})),answers:ans});
  LS.set("results",results.slice(0,30));
  // 오답 노트 갱신
  const wrong=LS.get("wrong",[]);
  qs.forEach((q,i)=>{
    const ok=ans[i]===q.answer, at=wrong.findIndex(w=>w.sig===q._sig);
    if(ok){if(at>=0)wrong.splice(at,1);}          // 맞히면 제거(오답모드·시험모드 공통)
    else if(session.mode==="exam"&&at<0)wrong.push({sig:q._sig,q});
  });
  LS.set("wrong",wrong);
  go(()=>result(session,ans));
}

function result(session,ans){
  const qs=session.qs,correct=ans.filter((a,i)=>a===qs[i].answer).length,pct=Math.round(correct/qs.length*100);
  setTop(session.level+" 결과");
  view.innerHTML=`
    <div class="score"><div class="big">${correct}/${qs.length}</div><div class="sub">${session.label} · 정답률 ${pct}%</div></div>
    <div class="card" style="padding:4px 16px">
    ${qs.map((q,i)=>{const ok=ans[i]===q.answer;return `<div class="rev"><span class="rn">${i+1}</span>
      <span class="rt">${esc(cleanStem(q.stem))}</span>
      <span class="rm" style="color:${ok?"var(--ok)":"var(--no)"}">${ok?"○":"✕"}</span></div>`;}).join("")}
    </div>
    <div class="foot">
      <button class="btn ghost" id="again">다시 풀기</button>
      <button class="btn" id="menu">처음으로</button></div>`;
  document.getElementById("again").onclick=()=>{if(session.mode==="wrong")go(beginWrong);else go(()=>beginExam(session.level,session.keys));};
  document.getElementById("menu").onclick=reset;
}

/* ---------------- 지난 결과 ---------------- */
function fmtDate(t){const d=new Date(t);const p=n=>String(n).padStart(2,"0");return `${d.getMonth()+1}.${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function resultsView(){
  setTop("지난 결과");
  const results=LS.get("results",[]);
  if(!results.length){view.innerHTML=`<div class="empty">아직 응시 기록이 없습니다.</div>`;return;}
  view.innerHTML=`<div class="card" style="padding:4px 16px">
    ${results.map((r,i)=>`<div class="listrow" data-i="${i}">
      <div class="d"><b>${esc(r.level)} ${esc(r.label)}</b><span>${fmtDate(r.date)} · 정답률 ${r.pct}%</span></div>
      <div class="sc">${r.correct}/${r.total}</div></div>`).join("")}
    </div>
    <button class="clear" id="clr">기록 전체 삭제</button>`;
  view.querySelectorAll(".listrow").forEach(el=>el.onclick=()=>go(()=>resultReview(results[+el.dataset.i])));
  document.getElementById("clr").onclick=()=>{if(confirm("지난 결과를 모두 삭제할까요?")){LS.set("results",[]);resultsView();}};
}
function resultReview(r){
  setTop("결과 상세",`${r.correct}/${r.total}`);
  view.innerHTML=`<div class="score"><div class="big">${r.correct}/${r.total}</div><div class="sub">${r.level} ${r.label} · ${r.pct}%</div></div>
    <div class="card" style="padding:4px 16px">
    ${r.qs.map((q,i)=>{const ok=r.answers[i]===q.answer;return `<div class="rev"><span class="rn">${i+1}</span>
      <span class="rt">${esc(cleanStem(q.stem))} <span style="color:var(--muted);font-size:12px">→ ${NUM[q.answer]} ${esc(q.choices[q.answer])}</span></span>
      <span class="rm" style="color:${ok?"var(--ok)":"var(--no)"}">${ok?"○":"✕"}</span></div>`;}).join("")}
    </div>`;
}

/* ---------------- 오답 노트 ---------------- */
function wrongView(){
  setTop("오답 노트");
  const wrong=LS.get("wrong",[]);
  if(!wrong.length){view.innerHTML=`<div class="empty">오답이 없습니다.<br>시험에서 틀린 문제가 자동으로 모입니다.</div>`;return;}
  view.innerHTML=`
    <button class="btn" id="solve" style="margin:8px 0 4px">오답 ${wrong.length}문항 다시 풀기</button>
    <div class="card" style="padding:4px 16px">
    ${wrong.map((w,i)=>`<div class="listrow" style="cursor:default">
      <span class="wq">${esc(cleanStem(w.q.stem))}</span>
      <span class="wt">${esc(w.q.level)} · ${esc(w.q.typeKo)}</span></div>`).join("")}
    </div>
    <button class="clear" id="clr">오답 전체 삭제</button>`;
  document.getElementById("solve").onclick=()=>go(beginWrong);
  document.getElementById("clr").onclick=()=>{if(confirm("오답 노트를 모두 비울까요?")){LS.set("wrong",[]);wrongView();}};
}

go(home);
</script>
<script>
/* PWA: 서비스워커 등록 (오프라인·홈화면 추가). file:// 로 열면 자동 무시됨. */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
